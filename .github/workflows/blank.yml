name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Android SDK & Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y android-sdk google-android-build-tools-installer

      - name: Zip files to AAB / APK structure
        run: |
          zip -r app-unsigned.aab . -x "*.git*" ".github/*"

      - name: Upload APK/AAB Artifact
        uses: actions/upload-artifact@v3
        with:
          name: phone-installable-app
          path: app-unsigned.aab
          
